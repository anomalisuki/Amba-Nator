<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Akinator Web</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090b10;color:#e8ecf1;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.wrap{max-width:900px;margin:auto;padding:20px}.terminal{background:#11151d;border:1px solid #28303c;border-radius:14px;overflow:hidden;box-shadow:0 12px 40px #0008}
.bar{padding:12px 16px;background:#171c25;border-bottom:1px solid #28303c;color:#9aa5b5}.body{padding:20px}
h1{font-size:20px;margin:0 0 8px}.muted{color:#8d98a8}.status{margin:14px 0;padding:10px 12px;border-radius:8px;background:#0c1016;color:#aeb8c6}
.status.ok{border-left:3px solid #61d095}.status.err{border-left:3px solid #ff6678;color:#ff9aa6}
.question{font-size:18px;line-height:1.5;margin:20px 0 14px}.progress{height:7px;background:#252c37;border-radius:99px;overflow:hidden;margin:8px 0 20px}
.progress>i{display:block;height:100%;width:0;background:#72a7ff;transition:.25s}.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}
button{font:inherit;border:1px solid #303948;background:#181e28;color:#e8ecf1;border-radius:9px;padding:12px;text-align:left;cursor:pointer}
button:hover{background:#202838;border-color:#52627a}button:disabled{opacity:.5;cursor:not-allowed}
.choice-num{color:#72a7ff;margin-right:8px}.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.themes button{text-align:center}.hidden{display:none!important}.guess{margin-top:20px;border:1px solid #394454;border-radius:12px;padding:16px;background:#151b24}
.guess img{display:block;max-width:180px;max-height:180px;object-fit:cover;border-radius:10px;margin:0 auto 14px}.guess h2{font-size:20px;margin:5px 0 10px}
.actions{display:flex;gap:10px;margin-top:15px}.actions button{flex:1;text-align:center}
pre{white-space:pre-wrap;word-break:break-word;background:#080b10;border:1px solid #252c37;border-radius:10px;padding:14px;color:#b9c6d6;overflow:auto}
.json-title{margin-top:24px;color:#8d98a8}
@media(max-width:650px){.choices,.themes{grid-template-columns:1fr}.body{padding:14px}}
</style>
</head>
<body>
<div class="wrap"><div class="terminal">
<div class="bar">=== akinator game ===</div>
<div class="body">
<h1>Akinator Web</h1>
<div class="muted">Creator : IzzXd</div>
<div class="muted">Saluran : <a href="https://whatsapp.com/channel/0029VbCv97v9Bb5tC5cZFl0K" target="_blank" rel="noopener">WhatsApp Channel</a></div>
<div id="status" class="status">Pilih tema untuk memulai.</div>

<section id="themeScreen">
<div>Pilih tema:</div>
<div class="themes">
<button onclick="chooseTheme(1)">1. Karakter</button>
<button onclick="chooseTheme(2)">2. Hewan</button>
<button onclick="chooseTheme(3)">3. Benda</button>
</div>
</section>

<section id="gameScreen" class="hidden">
<div id="counter"></div><div class="progress"><i id="progress"></i></div>
<div id="question" class="question"></div>
<div class="choices">
<button onclick="answer(0)"><span class="choice-num">1.</span>Ya</button>
<button onclick="answer(1)"><span class="choice-num">2.</span>Tidak</button>
<button onclick="answer(2)"><span class="choice-num">3.</span>Tidak tahu</button>
<button onclick="answer(3)"><span class="choice-num">4.</span>Mungkin</button>
<button onclick="answer(4)"><span class="choice-num">5.</span>Mungkin tidak</button>
<button onclick="goBack()"><span class="choice-num">0.</span>Kembali</button>
</div>
<div id="guess" class="guess hidden">
<img id="guessPhoto" class="hidden" alt="">
<h2 id="guessName"></h2><div id="guessDescription" class="muted"></div>
<div class="actions"><button onclick="confirmGuess()">Ya, benar</button><button onclick="rejectGuess()">Tidak, lanjut</button></div>
</div>
</section>
<div class="json-title">Response JSON</div><pre id="output">{}</pre>
</div></div></div>

<script>
const CREDIT={Creator:'IzzXd',Saluran:'https://whatsapp.com/channel/0029VbCv97v9Bb5tC5cZFl0K'};
const THEMES={1:['Karakter',1],2:['Hewan',14],3:['Benda',2]};
const game={sid:1,session:'',identifiant:'',step:1,num:1,progression:0,stepLastProposition:'',question:'',theme:'',guess:null};
const $=id=>document.getElementById(id);

function setStatus(msg,error=false){$('status').textContent=msg;$('status').className='status '+(error?'err':'ok')}
function setOutput(obj){$('output').textContent=JSON.stringify(obj,null,2)}
function setBusy(v){document.querySelectorAll('button').forEach(b=>b.disabled=v)}
async function api(path,form){
  const opt={method:form?'POST':'GET',credentials:'same-origin',headers:{}};
  if(form){opt.body=new URLSearchParams(form);opt.headers['Content-Type']='application/x-www-form-urlencoded;charset=UTF-8';opt.headers['X-Requested-With']='XMLHttpRequest'}
  const r=await fetch('/api'+path,opt);
  const t=await r.text();
  if(!r.ok)throw new Error('HTTP '+r.status+': '+t.slice(0,300));
  return t;
}
function parseJSON(s){try{return JSON.parse(s)}catch(e){throw new Error('Response bukan JSON: '+s.slice(0,200))}}

async function start(){
  await api('/');
  const body=await api('/game',{sid:String(game.sid),cm:'false'});
  const doc=new DOMParser().parseFromString(body,'text/html');
  const q=doc.querySelector('#question-label');
  const session=body.match(/session:\s*'([^']+)'/)?.[1]||body.match(/localStorage\.setItem\('session',\s*'([^']+)'\)/)?.[1]||body.match(/name="session"[^>]*value="([^"]+)"/)?.[1];
  const ident=body.match(/localStorage\.setItem\('identifiant',\s*'([^']+)'\)/)?.[1]||body.match(/name="identifiant"[^>]*value="([^"]+)"/)?.[1]||'';
  const question=q?.textContent.trim()||'';
  if(!session||!question)throw new Error('Gagal mengambil session/pertanyaan dari Akinator.');
  game.session=session;game.identifiant=ident;game.question=question;
  game.step=parseInt(body.match(/localStorage\.setItem\('step',\s*'(\d+)'\)/)?.[1]||'1');
  game.num=1;game.progression=0;game.stepLastProposition='';renderQuestion();
}
function handle(d){
  if(d.completion==='KO')throw new Error('Session expired / game tidak valid');
  if(d.completion==='SOUNDLIKE')return{lost:true};
  if(d.id_proposition){game.step=parseInt(d.step??game.step);game.stepLastProposition=String(game.step);return{guess:{id:d.id_proposition,id_base:d.id_base_proposition,name:d.name_proposition,description:d.description_proposition,photo:d.photo,pseudo:d.pseudo}}}
  if(d.question)game.question=d.question;if(d.step!==undefined)game.step=parseInt(d.step);if(d.progression!==undefined)game.progression=parseFloat(d.progression);return{};
}
async function answer(id){
 try{hideGuess();setBusy(true);let r=handle(parseJSON(await api('/answer',{step:String(game.step),progression:String(game.progression),sid:String(game.sid),cm:'false',answer:String(id),step_last_proposition:game.stepLastProposition,session:game.session})));if(!r.guess&&!r.lost)game.num++;if(r.lost)showLost();else if(r.guess)showGuess(r.guess);else renderQuestion()}catch(e){showError(e)}finally{setBusy(false)}
}
async function goBack(){
 if(game.num<=1){setStatus('Belum ada jawaban sebelumnya.');return}
 try{setBusy(true);handle(parseJSON(await api('/cancel_answer',{step:String(game.step),progression:String(game.progression),sid:String(game.sid),cm:'false',session:game.session})));game.num=Math.max(1,game.num-1);hideGuess();renderQuestion()}catch(e){showError(e)}finally{setBusy(false)}
}
async function rejectGuess(){
 try{hideGuess();setBusy(true);const r=handle(parseJSON(await api('/exclude',{step:String(game.step),sid:String(game.sid),cm:'false',progression:String(game.progression),session:game.session,forward_answer:'1'})));if(!r.guess&&!r.lost)game.num++;if(r.lost)showLost();else if(r.guess)showGuess(r.guess);else renderQuestion()}catch(e){showError(e)}finally{setBusy(false)}
}
async function confirmGuess(){
 const g=game.guess;if(!g)return;setBusy(true);
 try{await api('/choice',{sid:String(game.sid),pid:String(g.id),identifiant:game.identifiant,charac_name:g.name,charac_desc:g.description,session:game.session,step:String(game.step)})}catch(e){}
 const result={...CREDIT,status:true,theme:game.theme,total_questions:game.num,result:{name:g.name,description:g.description,photo:g.photo,pseudo:g.pseudo}};
 setOutput(result);setStatus('Akinator selesai menebak.');setBusy(false);
}
function chooseTheme(t){game.sid=THEMES[t][1];game.theme=THEMES[t][0];$('themeScreen').classList.add('hidden');$('gameScreen').classList.remove('hidden');setStatus('Memulai game...');setBusy(true);start().then(()=>setStatus('Game dimulai ✓')).catch(showError).finally(()=>setBusy(false))}
function renderQuestion(){$('counter').textContent=`[${game.num}] (${Math.round(game.progression)}%)`;$('question').textContent=game.question;$('progress').style.width=Math.max(0,Math.min(100,game.progression))+'%';setStatus('Pilih jawaban.')}
function showGuess(g){game.guess=g;$('guessName').textContent=g.name||'(tanpa nama)';$('guessDescription').textContent=g.description||'';if(g.photo){$('guessPhoto').src=g.photo;$('guessPhoto').classList.remove('hidden')}else $('guessPhoto').classList.add('hidden');$('guess').classList.remove('hidden');$('question').textContent='--- akinator memikirkan ---';setStatus('Apakah tebakan Akinator benar?')}
function hideGuess(){game.guess=null;$('guess').classList.add('hidden')}
function showLost(){const r={...CREDIT,status:true,theme:game.theme,total_questions:game.num,result:null,message:'Akinator menyerah'};setOutput(r);setStatus('Akinator menyerah, tidak bisa menebak.')}
function showError(e){console.error(e);setOutput({...CREDIT,status:false,error:e.message||String(e)});setStatus(e.message||String(e),true)}
</script>
</body></html>
